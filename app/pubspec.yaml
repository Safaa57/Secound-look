name: second_look
description: Second Look — on-device scam protection for SMS, links and calls.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

# Everything sensitive (SMS, calls, storage) is handled by our own native code on the device.
# The only packages are official ones from the Dart and Flutter teams and Google, used for the
# optional online deep check (http), the optional rewarded ad (google_mobile_ads), Plus (in_app_purchase) and choosing a screenshot (image_picker).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  google_mobile_ads: ">=7.0.0 <10.0.0"
  in_app_purchase: ^3.2.0
  image_picker: ^1.1.0
  secondlook_ios:
    path: packages/secondlook_ios

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/legal/
    - assets/i18n/
    - assets/certs/
