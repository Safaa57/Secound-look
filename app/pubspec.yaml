name: second_look
description: Second Look — on-device scam protection for SMS, links and calls.
publish_to: "none"
version: 1.7.0+17

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.35.1" # google_mobile_ads 7.x needs 3.35.1 (8.x/9.x need 3.38.1); PopScope.onPopInvokedWithResult (v1.6)

# Everything sensitive (SMS, calls, storage) is handled by our own native code on the device.
# The only packages are official ones from the Dart and Flutter teams and Google, used for the
# optional online deep check (http), the ads that keep the app free (google_mobile_ads, with Google's consent form),
# choosing a screenshot (image_picker) and on-device photo forensics (image). No purchases or subscriptions.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  google_mobile_ads: ">=7.0.0 <10.0.0"
  image_picker: ^1.1.0
  image: ^4.2.0
  secondlook_ios:
    path: packages/secondlook_ios

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/legal/
    - assets/i18n/
    - assets/certs/
    - assets/fonts/OFL-Sora.txt
    - assets/fonts/OFL-Manrope.txt
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
