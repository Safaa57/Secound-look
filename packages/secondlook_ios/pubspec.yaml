name: secondlook_ios
description: iOS side of Second Look (JavaScriptCore engine, call directory, settings bridge).
version: 1.0.0
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: SecondLookPlugin
