name: Build Second Look (Android APK + laptop web app)
on:
  workflow_dispatch:
  push:
 
# Optional settings (GitHub repo → Settings → Secrets and variables → Actions → Variables):
#   SL_API                   your Second Look server, e.g. https://secondlook-api.onrender.com  (turns on Deep check + Plus)
#   ADMOB_APP_ID_ANDROID     your AdMob app id         (Google's test id is used if empty)
#   ADMOB_REWARDED_ANDROID   your rewarded ad unit id  (Google's test unit is used if empty)
#   SL_OPERATOR, SL_ADDRESS, SL_EMAIL, SL_GRIEVANCE_NAME, SL_GRIEVANCE_EMAIL, SL_CITY
#                            who publishes the app, shown in the Terms and Privacy Policy (see app/docs/legal/LEGAL_CHECKLIST.md)
env:
  SL_API: ${{ vars.SL_API }}
  ADMOB_APP_ID_ANDROID: ${{ vars.ADMOB_APP_ID_ANDROID }}
  SL_OPERATOR: ${{ vars.SL_OPERATOR }}
  SL_ADDRESS: ${{ vars.SL_ADDRESS }}
  SL_EMAIL: ${{ vars.SL_EMAIL }}
  SL_GRIEVANCE_NAME: ${{ vars.SL_GRIEVANCE_NAME }}
  SL_GRIEVANCE_EMAIL: ${{ vars.SL_GRIEVANCE_EMAIL }}
  SL_CITY: ${{ vars.SL_CITY }}
  ADMOB_REWARDED_ANDROID: ${{ vars.ADMOB_REWARDED_ANDROID }}
 
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Set up the project
        working-directory: app
        run: bash tool/setup.sh
      - name: Build the APK
        working-directory: app
        run: |
          python3 tool/defines.py > build_defines.json
          flutter build apk --release --obfuscate --split-debug-info=build/symbols --dart-define-from-file=build_defines.json
      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: SecondLook-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
      # A test version that shows the exact error on screen if something goes wrong (bigger and slower; for testing only).
      - name: Build the test APK
        working-directory: app
        run: flutter build apk --debug --dart-define-from-file=build_defines.json
      - name: Save the test APK
        uses: actions/upload-artifact@v4
        with:
          name: SecondLook-TEST-APK
          path: app/build/app/outputs/flutter-apk/app-debug.apk
 
  # Starts the normal (release) app on an Android emulator and records what happens, so start-up crashes can be read here.
  android-test:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SecondLook-APK
          path: apk
      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open the app on an emulator and record the log
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r apk/app-release.apk
            adb logcat -c
            adb shell monkey -p com.secondlook.second_look -c android.intent.category.LAUNCHER 1
            sleep 40
            adb logcat -d > logcat.txt
            echo "===== CRASH DETAILS (send this part) =====" ; grep -n -A 45 -E "FATAL EXCEPTION|E/flutter|Unhandled Exception" logcat.txt | head -200 ; echo "===== END ====="
            adb shell pidof com.secondlook.second_look && echo "APP IS RUNNING (no crash)" || echo "APP IS NOT RUNNING (it crashed or closed)"
      - name: Save the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-log
          path: logcat.txt
 
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Set up the project
        working-directory: app
        run: bash tool/setup.sh
      - name: Build the laptop (web) app
        working-directory: app
        run: |
          python3 tool/defines.py > build_defines.json
          flutter build web --release --base-href "/${{ github.event.repository.name }}/" --dart-define-from-file=build_defines.json
      - name: Save the web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web
 
  # Publishes the laptop app at https://<your-username>.github.io/<repo-name>/
  # One-time: repo → Settings → Pages → Source: "GitHub Actions".
  pages:
    needs: web
    runs-on: ubuntu-latest
    continue-on-error: true   # skipped quietly until Pages is switched on
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
